# HomeVerse Nginx 配置文件

# HTTP 服务器配置
server {
    listen 80;
    server_name localhost;  # 替换为你的域名
    
    # 重定向到 HTTPS（生产环境启用）
    # return 301 https://$server_name$request_uri;
    
    # 客户端请求体大小限制（支持文件上传）
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    
    # 超时设置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # 日志配置
    access_log /var/log/nginx/homeverse_access.log;
    error_log /var/log/nginx/homeverse_error.log;
    
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    
    # 前端静态文件
    location / {
        root /var/www/homeverse/frontend/dist;  # 前端构建输出目录
        index index.html;
        try_files $uri $uri/ /index.html;  # SPA 路由支持
        
        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # HTML 文件不缓存
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
    
    # 后端 API 代理
    location /api/ {
        # 直接代理到后端服务
        proxy_pass http://127.0.0.1:3001/;
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 禁用缓存
        proxy_buffering off;
        proxy_cache off;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # 上传的文件访问
    location /uploads/ {
        alias /var/www/homeverse/backend/uploads/;
        
        # 图片缓存
        expires 30d;
        add_header Cache-Control "public";
        
        # 安全限制：只允许图片和文档
        location ~* \.(jpg|jpeg|png|gif|webp|pdf|doc|docx)$ {
            add_header Access-Control-Allow-Origin *;
        }
    }
    
    # 健康检查端点
    location /health-check {
        proxy_pass http://127.0.0.1:3001/health-check;
        access_log off;
    }
}

